<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — LifeLink</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-header-mount"></div>

  <main class="section">
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
        <div>
          <h1 style="margin: 0 0 4px;">Notifications</h1>
          <p style="margin: 0; color: var(--text-secondary);">Real-time platform alerts, donor responses, and escalation updates.</p>
        </div>
        <button type="button" id="mark-all-read-btn" class="btn btn-outline btn-sm">Mark All as Read</button>
      </div>

      <div id="notif-alert" class="alert hidden"></div>
      <div id="notif-list"></div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/notifications.js"></script>
</body>
</html>
